name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autonomy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if src/ references paid/keyed AI APIs
        run: |
          if grep -rniE '\b(openai|cohere|mistralai|generativeai)\b|sk-[A-Za-z0-9]{20,}|api[_-]?key' src/; then
            echo "::error::Forbidden reference found in src/ (SnipScout must stay 100% local)."
            exit 1
          fi
      - name: Launcher syntax
        run: |
          sh -n start-snipscout.sh
          cmp start-snipscout.sh Start-SnipScout.command
          file Start-SnipScout.bat | grep -q CRLF

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q --tb=short
      - run: uv run python scripts/check_contrast.py
      - run: uv run snipscout doctor
