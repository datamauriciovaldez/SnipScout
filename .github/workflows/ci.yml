name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autonomy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if src/ references paid/keyed AI APIs
        run: |
          if grep -rniE '\b(openai|cohere|mistralai|generativeai)\b|sk-[A-Za-z0-9]{20,}|api[_-]?key' src/; then
            echo "::error::Forbidden reference found in src/ (SnipScout must stay 100% local)."
            exit 1
          fi
      - name: Launcher syntax
        run: |
          sh -n start-snipscout.sh
          cmp start-snipscout.sh Start-SnipScout.command
          file Start-SnipScout.bat | grep -q CRLF

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q --tb=short
      - run: uv run python scripts/check_contrast.py
      - run: uv run python scripts/check_licenses.py
      - run: uv run snipscout doctor

  ui:
    # Real server + Chromium: API with session cookie, first-run screens in both themes, component gallery,
    # and the whole upload → analyze → edit → render flow with a fake speech model.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync
      - name: Install Chromium for Playwright
        run: uv run --with playwright==1.64.1 playwright install --with-deps chromium
      - run: uv run --with playwright==1.64.1 python scripts/smoke_ui.py --out smoke-shots
      - run: uv run --with playwright==1.64.1 python scripts/check_components.py
      - name: Full flow in the browser (fake speech model)
        run: uv run --with playwright==1.64.1 pytest -q --tb=short tests/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: smoke-shots/
          retention-days: 14

  audit:
    # Informational: known vulnerabilities in the locked runtime dependencies. Never blocks a merge.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv export --format requirements-txt --no-dev --no-hashes --no-emit-project > requirements-audit.txt
      - run: uvx pip-audit --requirement requirements-audit.txt --progress-spinner off
