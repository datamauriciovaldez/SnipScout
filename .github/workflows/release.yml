name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME} != version $version"; exit 1; }
      - name: Build sdist and wheel
        run: uv build
      - name: Ready-to-use archives (launchers keep their executable bit in the .tar.gz)
        run: |
          name="SnipScout-${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="$name/" -o "dist/$name-windows.zip" HEAD
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name-macos-linux.tar.gz" HEAD
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ && f {exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::no CHANGELOG entry for ${GITHUB_REF_NAME}"; exit 1; }
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "SnipScout $GITHUB_REF_NAME" --notes-file notes.md
