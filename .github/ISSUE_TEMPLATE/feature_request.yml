name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and why the current app makes it hard.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: principles
    attributes:
      label: Fits SnipScout's principles
      options:
        - label: Works offline on a normal laptop CPU, without accounts, keys or paid services.
          required: true
