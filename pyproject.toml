[project]
name = "snipscout"
version = "0.1.0.dev0"
description = "Turn long videos into short clips with word-by-word subtitles. 100% local, no accounts, no API keys."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mauricio Valdez Fuste" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "av>=14",
    "fastapi>=0.115",
    "faster-whisper>=1.1",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.8.1",
    "numpy>=1.26",
    "platformdirs>=4.2",
    "psutil>=6.0",
    "pydantic>=2.7",
    "pywebview>=5.0",
    "uvicorn>=0.30",
]

[project.scripts]
snipscout = "snipscout.cli:main"

[project.optional-dependencies]
embeddings = [
    "fastembed>=0.4",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-psutil",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snipscout"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "S", "BLE"]
ignore = ["S603"]  # subprocess without shell is our standard pattern; inputs are argument lists

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["imageio_ffmpeg", "ctranslate2", "faster_whisper", "faster_whisper.*", "fastembed"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real models or long runtime (excluded from default CI)"]
addopts = "-m 'not slow'"
